name: Check activity map
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
      - run: node --check app.js
      - run: node --check market-map.js
      - run: node --check map-preview.js
      - run: node --check token.js
      - run: node --check activity-detail.js
      - run: node --check live-data.js
      - run: node --check scripts/build-price-charts.mjs
      - run: node --check activity-view.js
      - run: node --check insight-page.js
      - run: node --check temperature-detail.js
      - run: node --check journal-view.js
      - run: node --check scripts/archive-sync.mjs
      - run: node --check research-panel.js
      - run: node --check exchange-panel.js
