name: Refresh live data and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
concurrency:
  group: sidequest-live-data
  cancel-in-progress: false
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore discovery and last successful live snapshot
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache
            data/snapshot.json
            data/temperature.json
            data/market-temperature.json
          key: sidequest-live-${{ github.run_id }}
          restore-keys: |
            sidequest-live-
      - name: Restore durable observations and publication state
        run: node scripts/archive-sync.mjs restore
        env:
          HISTORY_KEY: ${{ secrets.HISTORY_KEY }}
      - name: Collect free market data
        id: refresh
        continue-on-error: true
        run: node scripts/collect.mjs
      - name: Keep cached data when an upstream feed is unavailable
        if: steps.refresh.outcome == 'failure'
        run: echo "::warning::Refresh failed. Publishing the last valid snapshot with its original timestamp."
      - name: Collect daily sentiment and its recorded history
        id: temperature
        run: node scripts/collect-temperature.mjs
      - name: Refresh free daily prices for scenarios
        run: node scripts/collect-prices.mjs
      - name: Record replay evidence and publish the daily note
        run: node scripts/collect-risk-temperature.mjs
      - name: Verify data semantics
        run: node --test
      - name: Commit evidence before publishing the site
        run: node scripts/archive-sync.mjs save
        env:
          HISTORY_KEY: ${{ secrets.HISTORY_KEY }}
      - name: Save the newest valid snapshot and discovery cache
        if: steps.refresh.outcome == 'success' || steps.temperature.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            .cache
            data/snapshot.json
            data/temperature.json
            data/market-temperature.json
          key: sidequest-live-${{ github.run_id }}
      - name: Prepare public files
        run: |
          mkdir -p _site/lib _site/data
          cp index.html market-map.html token.html temperature.html journal.html styles.css activity.css activity-view.js activity-detail.js insights.css market.css site-shell.js insight-page.js temperature-detail.js journal-view.js app.js live-data.js market-ui.js map-preview.js market-map.js token.js research-panel.js exchange-panel.js favicon.svg CNAME _site/
          cp lib/*.js _site/lib/
          cp data/snapshot.json data/temperature.json data/market-temperature.json data/price-statistics.json data/price-charts.json data/journal.json data/archive-status.json _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
